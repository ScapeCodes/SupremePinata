############################################################
# +------------------------------------------------------+ #
# |                    Messages                          | #
# +------------------------------------------------------+ #
############################################################

prefix: "<dark_gray>[</dark_gray><gradient:#ff4d6d:#ffd166><bold>PINATA PARTY</bold></gradient><dark_gray>]</dark_gray>"
no-permission: "%prefix% <red>✖ Party pass denied! You do not have permission to do that."
unknown-command: "%prefix% <red>✖ That party trick does not exist! Use <white>/pinata help</white>."
help: |
  <dark_gray>✔</dark_gray> <gradient:#ff4d6d:#ffd166><bold>PINATA PARTY COMMANDS</bold></gradient> <dark_gray>✔</dark_gray>
  <yellow>✦</yellow> <white>/pinata spawn <type> [x world y z]</white>
  <yellow>✦</yellow> <white>/pinata stop</white>
  <yellow>✦</yellow> <white>/pinata info</white>
  <yellow>✦</yellow> <white>/pinata menu</white>
  <yellow>✦</yellow> <white>/pinata editor <type></white>
  <yellow>✦</yellow> <white>/pinata vote</white>
  <yellow>✦</yellow> <white>/pinata stats [player]</white>
  <yellow>✦</yellow> <white>/pinata debug</white>
  <yellow>✦</yellow> <white>/pinatapool [money]</white>
  <yellow>✦</yellow> <white>/pinata reload</white>
  <yellow>✦</yellow> <white>/pinata location set <pinata> [name]</white>
  <yellow>✦</yellow> <white>/pinata location delete/list</white>
usage-spawn: "%prefix% <red>✖ Usage: <white>/pinata spawn <type> [x y z world]</white>"
usage-editor: "%prefix% <red>✖ Usage: <white>/pinata editor <type></white>"
usage-location: "%prefix% <red>✖ Usage: <white>/pinata location set <pinata> [name]</white>, <white>delete <name></white>, or <white>list</white>"
usage-stats: "%prefix% <red>✖ Usage: <white>/pinata stats [player]</white>"
player-only: "%prefix% <red>✖ Only players can open menus."
unknown-pinata: "%prefix% <red>✖ Unknown pinata type: <white>%type%</white>."
invalid-world: "%prefix% <red>✖ That party world is not loaded."
invalid-location: "%prefix% <red>✖ Those party coordinates look wrong."
spawn-success: "%prefix% <green>✔</green> <yellow>LET'S PARTY!</yellow> <white>%type%</white> <green>pinata has spawned!"
spawn-failed: "%prefix% <red>✖ Could not start the party for <white>%type%</white>. Check the id, location, or active event."
survival-only-hit: "%prefix% <red>✖ Only survival mode players can hit the pinata."
stop-success: "%prefix% <yellow>✦ Party stopped! The active pinata was cleaned up."
reload-success: "%prefix% <green>✔ Party config reloaded! Messages, pinatas, rewards, locations and integrations are fresh."
vault-required: "%prefix% <red>✖ Vault economy is required for the money pool."
info-none: "%prefix% <gray>✦ No pinata party is active right now."
info-active: "%prefix% <yellow>✦ Active party:</yellow> <white>%type%</white> <dark_gray>•</dark_gray> <green>%hits%/%required_hits%</green> <yellow>hits</yellow>"
location-set: "%prefix% <green>✔ Party location <white>%name%</white> has been set."
location-set-pinata: "%prefix% <green>✔ Party location <white>%name%</white> has been set and assigned to <white>%type%</white>."
location-delete: "%prefix% <yellow>✦ Party location <white>%name%</white> has been removed."
location-list: "%prefix% <yellow>✦ Party locations:</yellow> <white>%locations%</white>"
location-save-failed: "%prefix% <red>✖ Could not save party locations. Check console for details."
stats-loading: "%prefix% <gray>✦ Loading party stats for <white>%player%</white>..."
money-pool-status: "%prefix% <gold>✦ Money Pool:</gold> <green>%current%</green><gray>/</gray><yellow>%target%</yellow> <gray>(remaining: %remaining%)</gray>"
money-pool-contribution: "%prefix% <green>✔</green> <gold>%player%</gold> <yellow>added</yellow> <green>%amount%</green> <yellow>to the money pool!</yellow> <white>%current%</white><gray>/</gray><white>%target%</white>"
money-pool-complete: "%prefix% <green>✔</green> <gradient:#f6d365:#fda085><bold>MONEY POOL COMPLETE!</bold></gradient> <yellow>Spawning the</yellow> <white>%pinata%</white> <yellow>pinata!</yellow>"
money-pool-invalid-amount: "%prefix% <red>✖ Usage: <white>/pinatapool <money></white>"
money-pool-payment-failed: "%prefix% <red>✖ Could not take that money from your balance."
money-pool-disabled: "%prefix% <red>✖ The money pool is disabled right now."
stats: |
  <dark_gray>✔</dark_gray> <gradient:#ff4d6d:#ffd166><bold>%player%'s PINATA STATS</bold></gradient> <dark_gray>✔</dark_gray>
  <yellow>✦</yellow> <white>Total Hits:</white> <green>%total_hits%</green>
  <yellow>✦</yellow> <white>Parties Participated:</white> <green>%parties_participated%</green>
  <yellow>✦</yellow> <white>Parties Won:</white> <green>%parties_won%</green>
  <yellow>✦</yellow> <white>Final Hits:</white> <green>%final_hits%</green>
  <yellow>✦</yellow> <white>Rewards Won:</white> <green>%rewards_won%</green>
debug: |
  <dark_gray>✔</dark_gray> <gradient:#ff4d6d:#ffd166><bold>SupremePinata Debug Report</bold></gradient> <dark_gray>✔</dark_gray>
  
  <yellow>✦</yellow> <white>Version:</white> <gray>%version%</gray>
  <yellow>✦</yellow> <white>Author:</white> <gray>%author%</gray>
  <yellow>✦</yellow> <white>Discord:</white> <gray>https://discord.gg/PHpuzZS</gray>
  
  <gold>Basic Information:</gold>
  <yellow>✦</yellow> <white>Pinatas Loaded:</white> <green>%pinatas_loaded%</green>
  <yellow>✦</yellow> <white>Locations Loaded:</white> <green>%locations_loaded%</green>
  <yellow>✦</yellow> <white>Database Type:</white> <green>%db_type%</green>
  <yellow>✦</yellow> <white>Database Connected:</white> <green>%db_connected%</green>
  
  <gold>Plugin Hooks:</gold>
  <yellow>✦</yellow> <white>Vault:</white> %hook_vault%
  <yellow>✦</yellow> <white>PlaceholderAPI:</white> %hook_placeholderapi%
  <yellow>✦</yellow> <white>NuVotifier:</white> %hook_nuvotifier%
  <yellow>✦</yellow> <white>VotifierPlus:</white> %hook_votifierplus%
  
  <green>Debug complete.</green>
event-started: "%prefix% <green>✔</green> <gradient:#ff4d6d:#ffd166><bold>A PINATA PARTY HAS STARTED!</bold></gradient> <yellow>Hit it for prizes!</yellow>"
event-complete: "%prefix% <green>✔</green> <gold>%player%</gold> <yellow>landed the final hit!</yellow> <gradient:#ff4d6d:#ffd166><bold>PARTY COMPLETE!</bold></gradient>"
vote-milestone: "%prefix% <aqua>✦ Vote Party:</aqua> <white>%votes%/%required%</white> <yellow>votes collected!</yellow>"
vote-party-start: "%prefix% <green>✔</green> <gradient:#55ff55:#55ffff><bold>VOTE GOAL REACHED!</bold></gradient> <yellow>Starting a vote pinata party!</yellow>"
menu-editor-saved: "%prefix% <green>✔ Pinata editor saved and reloaded."
menu-editor-save-failed: "%prefix% <red>✖ Could not save that pinata file. Check console for details."
