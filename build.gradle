plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'net.scape.project.supremepinata'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()

    maven { url 'https://repo.papermc.io/repository/maven-public/' }

    maven {
        name = 'essentialsx-snapshots'
        url = uri('https://repo.essentialsx.net/snapshots/')
        content {
            includeGroup 'net.essentialsx'
        }
    }
    maven {
        name = 'essentialsx'
        url = uri('https://repo.essentialsx.net/releases/')
        content {
            includeGroup 'net.essentialsx'
        }
    }

    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://repo.opencollab.dev/maven-snapshots/' }
    maven { url "https://repo.codemc.org/repository/maven-public/" }
    maven { url "https://repo.codemc.org/repository/maven-snapshots/" }
    maven { url 'https://repo.codemc.io/repository/creatorfromhell/' }
    maven {
        name = 'jitpack'
        url = uri('https://jitpack.io')
        content {
            includeGroupByRegex 'com\\.github\\..*'
        }
    }
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://repo1.maven.org/maven2/' }
    maven { url 'https://repo.rosewooddev.io/repository/public/' }
    maven { url 'https://repo.nexomc.com/releases/' }
    maven { url 'https://repo.nexomc.com/snapshots' }
    maven { url 'https://repo.oraxen.com/releases' }
    maven { url "https://repo.oraxen.com/releases" }
    maven { url "https://repo.nightexpressdev.com/releases" }
    maven { url "https://repo.dmulloy2.net/repository/public/" }
    maven { url "https://repo.alessiodp.com/releases/" }
    maven { url = "https://repo.lushplugins.org/releases/" }
    maven {
        url = "https://repo.artillex-studios.com/releases/"
    }
    maven {
        url = uri("https://mvn.wesjd.net/")
    }
    maven { url "https://repo.momirealms.net/releases/" }
    maven {
        name = "faststatsReleases"
        url = uri("https://repo.faststats.dev/releases")
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.spigotmc' &&
                requested.name == 'spigot-api') {
            useTarget 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
            because 'Compile consistently against Paper 1.21.4'
        }
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'

    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'com.h2database:h2:2.1.214'
    compileOnly 'com.arcaniax:HeadDatabase-API:1.3.3-SNAPSHOT'
    compileOnly 'com.mojang:authlib:1.5.21'
    compileOnly 'org.mariadb.jdbc:mariadb-java-client:3.3.2'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'org.black_ixx:playerpoints:3.3.2'
    compileOnly 'com.github.LoneDev6:itemsadder-api:3.6.3-beta-14'
    compileOnly 'de.tr7zw:item-nbt-api-plugin:2.15.7'
    compileOnly 'io.th0rgal:oraxen:1.190.0'
    compileOnly 'su.nightexpress.excellenteconomy:ExcellentEconomy:2.8.0'
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.3.0'
    compileOnly 'com.github.retrooper:packetevents-spigot:2.9.3'
    compileOnly 'io.github.valerashimchuck:simpleitemgenerator-api:1.5.0'
    compileOnly 'net.essentialsx:EssentialsX:2.22.0-SNAPSHOT'
    compileOnly 'net.momirealms:craft-engine-core:26.7'
    compileOnly 'net.momirealms:craft-engine-bukkit:26.7'

    compileOnly 'mysql:mysql-connector-java:8.0.33'
    compileOnly 'redis.clients:jedis:5.1.0'
    compileOnly "com.nexomc:nexo:1.6.0"
    compileOnly 'net.byteflux:libby-bukkit:1.3.1'
    compileOnly 'org.xerial:sqlite-jdbc:3.47.2.0'
    implementation 'dev.faststats.metrics:bukkit:0.29.4'
}

processResources {
    def props = [
            version: project.version,
            name: project.name
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

def devBuild = project.hasProperty('dev') && project.property('dev').toBoolean()
def devBuildVersion = project.findProperty('devBuildVersion') ?: 'SNAPSHOT'

jar {
    archiveBaseName.set("SupremePinata")

    if (devBuild) {
        archiveVersion.set("${project.version}-DEV-${devBuildVersion}")
    } else {
        archiveVersion.set(project.version.toString())
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Main-Class': 'net.scape.project.supremepinata.SupremePinata',
                'Implementation-Title': 'SupremePinata',
                'Implementation-Version': project.version.toString()
        )
    }

    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}
